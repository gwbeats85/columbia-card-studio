">COLUMBIA</div></section><section><label>Archivo Black 400</label><div class="sample" style="font-family:'Archivo Black';font-weight:400">COLUMBIA</div></section><script>document.fonts.ready.then(async()=>{const ctx=document.createElement('canvas').getContext('2d');for(const el of document.querySelectorAll('.sample')){const style=getComputedStyle(el);await document.fonts.load(style.fontWeight+' 100px '+style.fontFamily);ctx.font=style.fontWeight+' 100px '+style.fontFamily;const m=ctx.measureText('COLUMBIA');const size=10000/(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent);ctx.font=style.fontWeight+' '+size+'px '+style.fontFamily;el.style.fontSize=size+'px';el.style.letterSpacing=((906-ctx.measureText('COLUMBIA').width)/8)+'px';el.style.lineHeight='128px';}});</script>
